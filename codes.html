</head>

    <aside class="sidebar">

        <div><strong>Speed Enforcement</strong><span>Unit Guide</span></div>
      </div>
      <nav class="nav">
        <a href="home.html" class="nav-link" data-page="home">Home</a>
        <a href="ranks.html" class="nav-link" data-page="ranks">Rank Structure</a>
        <a href="equipment.html" class="nav-link" data-page="equipment">Uniform &amp; Weapons</a>
        <a href="vehicles.html" class="nav-link" data-page="vehicles">Vehicles</a>
        <a href="uof.html" class="nav-link" data-page="uof">Use of Force</a>
        <a href="policies.html" class="nav-link" data-page="policies">Quota &amp; LOA</a>

    </aside>
    <main class="main">
      <header class="topbar">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <h2>10-Codes</h2>
      </header>
      <div class="content">
        <section class="section">
          <h1>RTO 10-Codes</h1>
          <div class="codes-grid" id="codes-grid"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="shell.js"></script>
  <script>
    SEUShell.init("codes");
    var CODES = [
      ["10-0","Lost Eyes"],["10-1","Frequency Change"],["10-2","Negative"],["10-3","Stop Transmitting"],
      ["10-4","Affirmative"],["10-6","Busy"],["10-7","Out Of Service"],["10-8","In Service"],["10-9","Repeat"],
      ["10-10","Fight in Progress"],["10-11","Traffic Stop"],["10-12","Standby"],["10-13","Shots Fired"],
      ["10-14","Convoy"],["10-15","Subject in Custody, Enroute to station or county jail"],["10-17","Suspicious Person"],
      ["10-19","Ride Along"],["10-20","Location"],["10-22","Disregard"],["10-23","On Scene"],
      ["10-26","ETA (Estimated Arrival Time)"],["10-29","Warrant Check"],["10-30","Wanted Person"],
      ["10-31","Armed Suspect"],["10-32","Request Backup (Code 1-2-3)"],["10-35","Not Wanted / No Warrants"],
      ["10-38","Suspicious Vehicle"],["11-44","Person Deceased"],["10-50","Vehicle Accident"],
      ["10-51","Request Towing Service"],["10-52","Request EMS"],["10-53","Request Fire Department"],
      ["10-54","Hit and Run"],["10-62","Kidnapping"],["10-63","Radio Check"],["10-65","Armed Robbery"],
      ["10-66","Reckless Driver"],["10-67","Fire"],["10-70","Foot Pursuit"],["10-71","Request Supervisor at Scene"],
      ["10-73","Advise Status"],["10-80","Vehicle Pursuit"],["10-90","Bank Alarm"],["10-91","Unnecessary use of Radio"],
      ["10-97","Enroute"],["10-98","Body / DB discovered"],["10-99","Officer In Distress / Officer down"]
    ];
    var grid = document.getElementById("codes-grid");
    CODES.forEach(function (c) {
      var el = document.createElement("div");
      el.className = "code-item";
      el.innerHTML = "<strong>" + c[0] + "</strong><span>" + c[1] + "</span>";
      grid.appendChild(el);
    });
  </script>
</body>
</html>
