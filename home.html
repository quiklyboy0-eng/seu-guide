<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Guides · SEU</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="hub-body">
  <div class="hub">
    <header class="hub-top">
      <button type="button" class="hub-icon-btn" id="menu-toggle" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="hub-top-title">SEU Guide</div>
      <button type="button" class="hub-icon-btn" id="logout" aria-label="Sign out" title="Sign out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </header>

    <aside class="hub-sidebar" id="sidebar">
      <div class="hub-brand">
        <span class="hub-mark">SEU</span>
        <div>
          <strong>Speed Enforcement</strong>
          <span>Unit Guide</span>
        </div>
      </div>
      <nav class="hub-nav">
        <a href="home.html" class="hub-nav-link active">Guides</a>
        <a href="roster.html" class="hub-nav-link">Roster</a>
        <a href="highrank.html" class="hub-nav-link" id="nav-highrank" style="display:none">High Rank</a>
        <a href="edit.html" class="hub-nav-link" id="edit-link" style="display:none">Edit guide</a>
        <a href="admins.html" class="hub-nav-link" id="nav-admins" style="display:none">Admin Bypass</a>
      </nav>
      <div class="hub-user" id="user-box"></div>
      <button type="button" class="hub-signout" id="logout-side">Sign out</button>
    </aside>
    <div class="hub-scrim" id="scrim"></div>

    <main class="hub-main">
      <div class="hub-content">
        <div class="hub-heading">
          <h1>Guides</h1>
          <p id="guides-meta">Official unit guides</p>
        </div>
        <div class="hub-cards" id="guides-list"></div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    if (!window.SEUAuth || !SEUAuth.requireAuth()) { /* redirect */ }

    (async function () {
      if (SEUAuth.loadExtraAdmins) await SEUAuth.loadExtraAdmins();

      var session = SEUAuth.getSession();
      var box = document.getElementById("user-box");
      if (box && session) {
        box.innerHTML =
          "<strong>" + (session.globalName || session.username || "Member") + "</strong>" +
          "<span>@" + (session.username || "") + "</span>";
      }

      if (SEUAuth.canAccessHighRank && SEUAuth.canAccessHighRank()) {
        var hr = document.getElementById("nav-highrank");
        if (hr) hr.style.display = "";
      }
      if (SEUAuth.canEdit && SEUAuth.canEdit()) {
        var el = document.getElementById("edit-link");
        if (el) el.style.display = "";
      }
      if (SEUAuth.isPrimaryAdmin && SEUAuth.isPrimaryAdmin()) {
        var ad = document.getElementById("nav-admins");
        if (ad) ad.style.display = "";
      }

      function logout() { SEUAuth.logout(); }
      document.getElementById("logout").addEventListener("click", logout);
      document.getElementById("logout-side").addEventListener("click", logout);

      var sidebar = document.getElementById("sidebar");
      var scrim = document.getElementById("scrim");
      document.getElementById("menu-toggle").addEventListener("click", function () {
        sidebar.classList.toggle("open");
        scrim.classList.toggle("open");
      });
      scrim.addEventListener("click", function () {
        sidebar.classList.remove("open");
        scrim.classList.remove("open");
      });

      var guides = [
        { id: "ranks", href: "ranks.html", title: "Rank Structure", desc: "Command through low ranks — hierarchy and promotion path.", icon: "badge" },
        { id: "equipment", href: "equipment.html", title: "Uniform & Weapons", desc: "Approved uniforms, loadouts and weapon classes.", icon: "shield" },
        { id: "vehicles", href: "vehicles.html", title: "Vehicles", desc: "Fleet access by rank, lighting and vehicle standards.", icon: "car" },
        { id: "uof", href: "uof.html", title: "Use of Force", desc: "Force continuum and when force is authorized.", icon: "gavel" },
        { id: "policies", href: "policies.html", title: "Quota & LOA", desc: "Monthly quota, leave of absence and activity rules.", icon: "clipboard" },
        { id: "retirement", href: "retirement.html", title: "Retirement", desc: "How to retire cleanly — callsigns and rank status.", icon: "flag" },
        { id: "codes", href: "codes.html", title: "10-Codes", desc: "RTO 10-codes reference for radio traffic.", icon: "radio" },
        { id: "response", href: "response.html", title: "Response Codes", desc: "Priority and response codes used on duty.", icon: "bolt" },
        { id: "command", href: "command.html", title: "Command", desc: "Command signatures and unit leadership.", icon: "star" },
        { id: "roster", href: "roster.html", title: "Personnel Roster", desc: "Official roster — callsigns, ranks and records.", icon: "users" },
        { id: "highrank", href: "highrank.html", title: "High Rank Guide", desc: "Promotions, quota enforcement and High Rank duties.", icon: "wrench", gated: "highrank" }
      ];

      var ICONS = {
        badge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h3M15 12h3M7 16h10"/></svg>',
        shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/></svg>',
        car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 16l1.5-6h11L19 16M7 16v2M17 16v2M4 16h16"/><circle cx="8" cy="16" r="1.5"/><circle cx="16" cy="16" r="1.5"/></svg>',
        gavel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 4l6 6M4 20l6-2 8-8-4-4-8 8-2 6zM12 8l4 4"/></svg>',
        clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h4"/></svg>',
        flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 21V4m0 0h10l-2 4 2 4H5"/></svg>',
        radio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M7 7V5m5 6h.01M9 15h6"/></svg>',
        bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
        star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3l2.5 6.5L21 10l-5 4.5L17.5 21 12 17.5 6.5 21 8 14.5 3 10l6.5-.5L12 3z"/></svg>',
        users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 2.5-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5.3 4 2 4 5"/></svg>',
        wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14.5 6.5a4 4 0 00-5.5 5.5L4 17l3 3 5-5a4 4 0 005.5-5.5L15 12l-2.5-2.5 2-3z"/></svg>'
      };

      function getProgress(id) {
        try {
          var map = JSON.parse(localStorage.getItem("seu_guide_progress_v1") || "{}");
          return Math.min(100, Math.max(0, Number(map[id]) || 0));
        } catch (e) { return 0; }
      }
      function markOpened(id) {
        try {
          var map = JSON.parse(localStorage.getItem("seu_guide_progress_v1") || "{}");
          map[id] = 100;
          localStorage.setItem("seu_guide_progress_v1", JSON.stringify(map));
        } catch (e) {}
      }

      function ring(pct) {
        var r = 15, c = 2 * Math.PI * r, off = c - (pct / 100) * c;
        return (
          '<svg class="hc-ring" viewBox="0 0 40 40">' +
          '<circle class="hc-ring-bg" cx="20" cy="20" r="' + r + '"/>' +
          '<circle class="hc-ring-fg" cx="20" cy="20" r="' + r + '" style="stroke-dasharray:' + c + ';stroke-dashoffset:' + off + '"/>' +
          '<text x="20" y="21" text-anchor="middle" dominant-baseline="middle" class="hc-ring-txt">' +
          (pct >= 100 ? "100%" : pct + "%") + "</text></svg>"
        );
      }

      var visible = guides.filter(function (g) {
        if (g.gated === "highrank") return SEUAuth.canAccessHighRank && SEUAuth.canAccessHighRank();
        return true;
      });
      document.getElementById("guides-meta").textContent =
        visible.length + " guides · a page counts as read when opened";

      var list = document.getElementById("guides-list");
      list.innerHTML = visible.map(function (g) {
        var pct = getProgress(g.id);
        var status = pct >= 100
          ? '<span class="hc-status done">✓ Fully read</span>'
          : '<span class="hc-status">Not started</span>';
        return (
          '<a class="hc-card" href="' + g.href + '" data-id="' + g.id + '">' +
          '<div class="hc-row">' +
          '<div class="hc-icon">' + (ICONS[g.icon] || ICONS.badge) + '</div>' +
          ring(pct) +
          '</div>' +
          '<h3>' + g.title + '</h3>' +
          '<p>' + g.desc + '</p>' +
          status +
          '</a>'
        );
      }).join("");

      list.querySelectorAll(".hc-card").forEach(function (a) {
        a.addEventListener("click", function () { markOpened(a.getAttribute("data-id")); });
      });
    })();
  </script>
</body>
</html>
